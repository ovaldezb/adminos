<!-- Login Page with Glassy Modern Design -->
<div class="min-h-screen bg-gradient-to-br from-sky-400 via-purple-500 to-pink-500 flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Animated Background Elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-20 w-72 h-72 bg-white/10 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-purple-300/20 rounded-full blur-3xl animate-pulse delay-1000"></div>
    <div class="absolute top-1/2 left-1/2 w-80 h-80 bg-sky-300/20 rounded-full blur-3xl animate-pulse delay-500"></div>
  </div>

  <!-- Login Container -->
  <div class="relative z-10 w-full max-w-md">
    
    <!-- Logo & Brand -->
    <div class="text-center mb-8 animate-fade-in">
      <div class="inline-block p-4 glass rounded-2xl mb-4">
        <i class="ri-building-4-fill text-6xl text-white drop-shadow-lg"></i>
      </div>
      <h1 class="text-4xl font-bold text-white mb-2 drop-shadow-lg">CondoAdmin</h1>
      <p class="text-white/90 text-lg drop-shadow">Sistema de Gestión de Condominios</p>
    </div>

    <!-- Login Card -->
    <div class="glass rounded-2xl p-8 shadow-2xl backdrop-blur-xl animate-slide-up">
      
      <!-- Welcome Text -->
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-neutral-800 mb-2">¡Bienvenido de vuelta!</h2>
        <p class="text-neutral-600">Ingresa tus credenciales para continuar</p>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onLogin()" class="space-y-5">
        
        <!-- Email Field -->
        <div class="form-control">
          <label class="label">
            <span class="label-text font-semibold text-neutral-700">
              <i class="ri-mail-fill mr-1"></i>
              Correo Electrónico
            </span>
          </label>
          <div class="relative">
            <input 
              type="email" 
              [(ngModel)]="email"
              name="email"
              placeholder="admin@condoadmin.com" 
              class="input input-bordered w-full rounded-2xl pl-12 bg-white/80 focus:bg-white transition-all"
              required
            />
            <i class="ri-mail-line absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 text-xl"></i>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-control">
          <label class="label">
            <span class="label-text font-semibold text-neutral-700">
              <i class="ri-lock-fill mr-1"></i>
              Contraseña
            </span>
          </label>
          <div class="relative">
            <input 
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••" 
              class="input input-bordered w-full rounded-2xl pl-12 pr-12 bg-white/80 focus:bg-white transition-all"
              required
            />
            <i class="ri-lock-line absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 text-xl"></i>
            <button 
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-600 transition-colors"
            >
              <i [class]="showPassword() ? 'ri-eye-off-line text-xl' : 'ri-eye-line text-xl'"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <label class="label cursor-pointer gap-2 p-0">
            <input 
              type="checkbox" 
              [(ngModel)]="rememberMe"
              name="rememberMe"
              class="checkbox checkbox-primary checkbox-sm rounded-lg" 
            />
            <span class="label-text text-neutral-600">Recordarme</span>
          </label>
          <a href="#" class="text-sm text-primary hover:text-secondary transition-colors font-medium">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Login Button -->
        <button 
          type="submit"
          class="btn btn-primary w-full rounded-2xl text-lg h-14 shadow-lg hover:shadow-xl transition-all hover:scale-[1.02]"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="loading loading-spinner loading-md"></span>
            <span>Iniciando sesión...</span>
          } @else {
            <i class="ri-login-box-fill text-xl"></i>
            <span>Iniciar Sesión</span>
          }
        </button>
      </form>

      <!-- Divider -->
      <div class="divider my-6 text-neutral-500">O continúa con</div>

      <!-- Social Login -->
      <div class="grid grid-cols-2 gap-3">
        <button class="btn btn-outline rounded-2xl hover:glass transition-all">
          <i class="ri-google-fill text-xl text-red-500"></i>
          Google
        </button>
        <button class="btn btn-outline rounded-2xl hover:glass transition-all">
          <i class="ri-microsoft-fill text-xl text-blue-500"></i>
          Microsoft
        </button>
      </div>

      <!-- Sign Up Link -->
      <div class="text-center mt-6">
        <p class="text-neutral-600">
          ¿No tienes cuenta? 
          <a href="#" class="text-primary hover:text-secondary font-semibold transition-colors ml-1">
            Regístrate aquí
          </a>
        </p>
      </div>
    </div>

    <!-- Footer Info -->
    <div class="text-center mt-8 text-white/80 text-sm">
      <p>© 2025 CondoAdmin. Todos los derechos reservados.</p>
      <div class="flex items-center justify-center gap-4 mt-3">
        <a href="#" class="hover:text-white transition-colors">Términos</a>
        <span>•</span>
        <a href="#" class="hover:text-white transition-colors">Privacidad</a>
        <span>•</span>
        <a href="#" class="hover:text-white transition-colors">Soporte</a>
      </div>
    </div>
  </div>
</div>
